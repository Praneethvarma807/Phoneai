name: Android APK Build & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-verify-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (required for Gradle 9.3.1 / AGP 9.1.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK packages and accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Optional: configure DEBUG_KEYSTORE_* secrets once to keep debug APK signing stable across CI runs.
      - name: Configure persistent debug signing (optional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            : "${DEBUG_STORE_PASSWORD:?Set DEBUG_STORE_PASSWORD when DEBUG_KEYSTORE_BASE64 is configured}"
            : "${DEBUG_KEY_PASSWORD:?Set DEBUG_KEY_PASSWORD when DEBUG_KEYSTORE_BASE64 is configured}"
            KEYSTORE_PATH="$RUNNER_TEMP/phoneai-debug.keystore"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "DEBUG_STORE_PASSWORD=$DEBUG_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DEBUG_KEY_ALIAS=${DEBUG_KEY_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
            echo "DEBUG_KEY_PASSWORD=$DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::notice::No persistent debug keystore secret configured; Gradle will use its standard debug signing."
          fi

      - name: Run unit tests, Lint, and build Debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew clean testDebugUnitTest lintDebug assembleDebug --stacktrace
          else
            gradle clean testDebugUnitTest lintDebug assembleDebug --stacktrace
          fi

      - name: Verify Debug APK signature, package metadata, and SHA-256
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          ls -lh "$APK"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_ROOT/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 5
          sha256sum "$APK"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-commander-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Optional: builds minified R8 Release APK when persistent upload keystore secrets are configured.
      - name: Build and verify signed Release APK (optional)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          KEYSTORE_PATH="$RUNNER_TEMP/phoneai-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          export KEYSTORE_PATH
          if [ -x ./gradlew ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$RELEASE_APK"
          ls -lh "$RELEASE_APK"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RELEASE_APK"
          sha256sum "$RELEASE_APK"

      - name: Upload Release APK artifact (optional)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-commander-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
